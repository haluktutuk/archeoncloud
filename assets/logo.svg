    <path d="M49 152 L100 46 L151 152"
          fill="none" stroke="url(#lgPlate)" stroke-width="23" stroke-linejoin="miter" stroke-linecap="butt"/>
    <path d="M68 117 L132 117"
          fill="none" stroke="url(#lgPlate)" stroke-width="19" stroke-linecap="butt"/>
    <path d="M49 152 L100 46 L151 152"
          fill="none" stroke="url(#lgRidge)" stroke-width="7" stroke-linejoin="miter" stroke-linecap="butt"/>
  </g>

  <g transform="translate(214,0)" font-family="'Helvetica Neue', Arial, sans-serif">
    <text x="0" y="96" font-size="62" font-weight="800" letter-spacing="1" fill="#0B1220">ARCHEON</text>
    <text x="2" y="150" font-size="34" font-weight="600" letter-spacing="14" fill="#5E80A6">CLOUD</text>
  </g>
