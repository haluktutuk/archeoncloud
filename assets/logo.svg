<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Archeon Cloud">
  <defs>
    <linearGradient id="lgSteel" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d2734"/>
      <stop offset="0.55" stop-color="#0f151f"/>
      <stop offset="1" stop-color="#06090f"/>
    </linearGradient>
    <linearGradient id="lgPlate" x1="100" y1="42" x2="100" y2="156" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EDF3FA"/>
      <stop offset="0.4" stop-color="#C3CFDE"/>
      <stop offset="0.72" stop-color="#93A3BA"/>
      <stop offset="1" stop-color="#63728B"/>
    </linearGradient>
    <linearGradient id="lgRidge" x1="100" y1="42" x2="100" y2="156" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#DCEBFB" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#DCEBFB" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lgEdge" x1="20" y1="30" x2="180" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7FB6E4"/>
      <stop offset="1" stop-color="#3B4763"/>
    </linearGradient>
  </defs>

  <g>
    <polygon points="100,8 180,54 180,146 100,192 20,146 20,54"
